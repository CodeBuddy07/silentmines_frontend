name: Deploy Silentmines Frontend

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy app files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: ".next,public,package*.json,next.config.js"
          target: "/var/www/greenlove.fun/"
          rm: true
          debug: true

      - name: Restart Next.js server on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            #!/bin/bash
            set -e

            cd /var/www/greenlove.fun

            echo "✅ Ensuring Node and PM2 are installed..."
            if ! command -v node >/dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
              apt install -y nodejs
            fi

            if ! command -v pm2 >/dev/null; then
              npm install -g pm2
            fi

            echo "📦 Installing production dependencies..."
            npm ci --production

            echo "🛑 Stopping existing process..."
            pm2 delete silentmines-frontend || echo "No existing process to stop"

            echo "🔌 Killing port 3000 if occupied..."
            fuser -k 3000/tcp || echo "Port 3000 was free"

            sleep 2

            echo "🚀 Starting Next.js application with PM2..."
            pm2 start npm --name "silentmines-frontend" -- start

            # Make PM2 startup persistent
            pm2 save
            pm2 startup systemd -u $USER --hp $HOME || true

            sleep 5

            echo "🔍 Checking application status..."
            pm2 status silentmines-frontend
            curl -f http://localhost:3000 || echo "⚠️  App not responding on port 3000"
