name: Deploy Silentmines Frontend

on:
  push:
    branches: ["master"]

jobs:
  deploy-from-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node (for lockfile generation if needed)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Deploy source to VPS (rsync)
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='.git' --exclude='node_modules'
          path: .
          remote_path: /var/www/greenlove.fun
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Build & restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/greenlove.fun

            if ! command -v node >/dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            if ! command -v pm2 >/dev/null; then npm i -g pm2; fi

            npm ci
            npm run build

            if pm2 list | grep -q "silentmines-frontend"; then
              pm2 reload silentmines-frontend
            else
              pm2 start npm --name "silentmines-frontend" -- start
            fi

            pm2 save
